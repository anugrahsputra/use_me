name: use_me
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio_cache_interceptor: ^4.0.6
  dio: ^5.9.2
  bloc: ^9.2.1
  dartz: ^0.10.1
  get_it: ^9.2.1
  go_router: ^18.0.0
  # native_dio_adapter: ^1.5.1
  rxdart: ^0.28.0
  google_fonts: ^8.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  internet_connection_checker: ^3.0.1
  flutter_secure_storage: ^11.0.0
  # http_certificate_pinning: ^3.0.1
  encrypt: ^5.0.3
  # sentry_flutter: ^8.14.2
  # sentry_logging: ^8.14.2
  # sentry_dio: ^8.14.2
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  formz: ^0.8.0
  flutter_bloc: ^9.1.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http_cache_hive_store: ^5.1.0
  talker_flutter: ^5.1.17
  talker_bloc_logger: ^5.1.17
  talker_dio_logger: ^5.1.17
  uuid: ^4.6.0

dev_dependencies:
  sentry_dart_plugin: ^3.3.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.4.2
  build_runner: ^2.16.1
  bloc_test: ^10.0.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  hive_ce_generator: ^1.11.3
  mockito: ^5.8.1

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: use-me
  org: personal-gmp

# freezed 3.x emits `final` in generated constructor params, which Dart 3.13
# rejects. freezed 4 fixes it but needs analyzer >=13, and hive_ce_generator
# 1.11.3 needs analyzer ^14. `test` 1.31.1 caps analyzer at <14 and can't move
# because flutter_test pins test_api 0.7.12. analyzer is a build-time-only
# dependency of the test runner, so overriding it unblocks codegen.
dependency_overrides:
  analyzer: ^14.0.0
